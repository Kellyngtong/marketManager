<input
  #avatarInput
  type="file"
  accept="image/*"
  hidden
  (change)="onAvatarSelected($event)"
/>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content class="profile-header" *ngIf="user as current">
      <button
        type="button"
        class="avatar-button"
        (click)="triggerAvatarPicker()"
        [disabled]="isUploadingAvatar"
        aria-label="Cambiar foto de perfil"
      >
        <ion-avatar>
          <img [src]="current.avatar || 'https://www.gravatar.com/avatar?d=mp&s=160'" alt="avatar" />
        </ion-avatar>
        <ion-icon class="camera-icon" name="camera"></ion-icon>
        <ion-spinner *ngIf="isUploadingAvatar" name="crescent" class="avatar-spinner"></ion-spinner>
      </button>
      <input
        #avatarInput
        type="file"
        accept="image/*"
        hidden
        (change)="onAvatarSelected($event)"
      />
      <div>
        <h2>{{ current.nombre || current.username }}</h2>
        <ion-chip color="primary">
          <ion-label>{{ getUserRoleLabel(current) }}</ion-label>
        </ion-chip>
        <p class="hint">Pulsa la imagen para cambiar tu avatar.</p>
      </div>
    </ion-card-content>
  </ion-card>

  <form [formGroup]="profileForm">
    <ion-item>
      <ion-label position="stacked">Nombre</ion-label>
      <ion-input formControlName="nombre"></ion-input>
    </ion-item>
    <ion-note
      color="danger"
      *ngIf="profileForm.get('nombre')?.touched && profileForm.get('nombre')?.invalid"
    >
      El nombre es obligatorio.
    </ion-note>

    <ion-item>
      <ion-label position="stacked">Email</ion-label>
      <ion-input formControlName="email" type="email"></ion-input>
    </ion-item>
    <ion-note
      color="danger"
      *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.invalid"
    >
      Ingresa un email válido.
    </ion-note>

    <ion-item>
      <ion-label position="stacked">Teléfono</ion-label>
      <ion-input formControlName="telefono" type="tel"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Dirección</ion-label>
      <ion-textarea formControlName="direccion" autoGrow="true"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Rol</ion-label>
      <ion-input formControlName="rol" readonly></ion-input>
    </ion-item>
  </form>

  <div class="actions">
    <ion-button
      *ngIf="!isPremiumUser()"
      expand="block"
      color="warning"
      class="premium-upgrade-btn"
      (click)="goToPremiumCheckout()"
      >HACERTE PREMIUM: 15 €</ion-button
    >
    <ion-button expand="block" color="success" (click)="saveProfile()"
      >Guardar cambios</ion-button
    >
    <ion-button expand="block" fill="clear" color="medium" (click)="confirmLogout()"
      >Cerrar sesión</ion-button
    >
  </div>
</ion-content>
