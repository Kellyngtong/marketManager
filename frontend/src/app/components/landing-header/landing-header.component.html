<ion-header mode="ios" class="landing-header">
  <ion-toolbar>
    <div class="navbar-wrapper">
      <!-- LOGO -->
      <div class="navbar-logo">
        <a routerLink="/home" class="logo-link">
          <!-- #####CÓDIGO MODIFICADO --- Aparece el logo -->
          <img src="assets/icon/miniLogo.png" alt="Mercachona" class="logo-img">
        </a>
      </div>

      <!-- MENU DESKTOP (only show when no user) -->
      <ng-container *ngIf="!(user$ | async)">
        <nav class="navbar-menu-desktop">
          <a href="#" class="menu-item">Conócenos</a>
          <a href="#" class="menu-item">Supermercados</a>
          <a href="#" class="menu-item">Trabaja con nosotros</a>
          <a href="#" class="menu-item">Atención al cliente</a>
        </nav>
      </ng-container>

      <!-- ACTIONS -->
      <div class="navbar-actions">
        <!-- CART (only show when user is logged) -->
        <ng-container *ngIf="user$ | async">
          <ion-button fill="clear" routerLink="/cart" class="cart-btn">
            <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
          </ion-button>
        </ng-container>

        <!-- LANGUAGE SELECTOR (only show when no user) -->
        <ng-container *ngIf="!(user$ | async)">
          <div class="language-selector">
            <button class="lang-btn" (click)="toggleLanguage()">
              <ion-icon name="globe"></ion-icon>
              <span class="lang-label">{{ currentLanguage | uppercase }}</span>
            </button>
          </div>
        </ng-container>

        <!-- LOGIN / LOGOUT BUTTONS -->
        <ng-container *ngIf="!(user$ | async); else logoutButton">
          <ion-button
            (click)="goToWelcome()"
            
            fill="solid"
            size="small"
            class="auth-btn"
          >
            Acceder
          </ion-button>
        </ng-container>

        <ng-template #logoutButton>
          <ion-button
            fill="clear"
            (click)="logout()"
            class="logout-btn"
          >
            <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
          </ion-button>
        </ng-template>

        <!-- MENU MOBILE -->
        <ion-buttons slot="end">
          <ion-menu-button menu="menu-principal" class="menu-mobile-btn"  ></ion-menu-button>
        </ion-buttons>

        

      </div>
    </div>
  </ion-toolbar>
</ion-header>

<!-- MOBILE MENU -->
<ion-menu side="end" menuId="menu-principal" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-menu-toggle *ngIf="!(user$ | async)">
        <ion-item button href="#" class="menu-mobile-item">
          <ion-icon name="information-circle" slot="start"></ion-icon>
          <ion-label>Conócenos</ion-label>
        </ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle *ngIf="!(user$ | async)">
        <ion-item button href="#" class="menu-mobile-item">
          <ion-icon name="storefront" slot="start"></ion-icon>
          <ion-label>Supermercados</ion-label>
        </ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle *ngIf="!(user$ | async)">
        <ion-item button href="#" class="menu-mobile-item">
          <ion-icon name="briefcase" slot="start"></ion-icon>
          <ion-label>Trabaja con nosotros</ion-label>
        </ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle *ngIf="!(user$ | async)">
        <ion-item button href="#" class="menu-mobile-item">
          <ion-icon name="help-circle" slot="start"></ion-icon>
          <ion-label>Atención al cliente</ion-label>
        </ion-item>
      </ion-menu-toggle>
      <!-- ###### CÓDIGO MODIFICADO --- Se ha quitado este item del menú  delmóvil.
      <ion-menu-toggle *ngIf="!(user$ | async)">
        <ion-item>
          <ion-label>Idioma</ion-label>
        </ion-item>
      </ion-menu-toggle>
      -->
      <ion-menu-toggle *ngIf="!(user$ | async)">
        <ion-item button (click)="goToWelcome()" class="menu-mobile-item">
          <ion-icon name="log-in" slot="start"></ion-icon>
          <ion-label>Acceder</ion-label>
        </ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle *ngIf="user$ | async">
        <ion-item button routerLink="/cart" class="menu-mobile-item">
          <ion-icon name="cart" slot="start"></ion-icon>
          <ion-label>Carrito</ion-label>
        </ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle *ngIf="user$ | async">
        <ion-item button (click)="logout()" class="menu-mobile-item">
          <ion-icon name="log-out" slot="start"></ion-icon>
          <ion-label>Cerrar sesión</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- No sé qué hace, pero una vez puesto se puede acceder al menú del móvil -->
<ion-router-outlet id="main-content"></ion-router-outlet>
