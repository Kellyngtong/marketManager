<input
  #avatarInput
  type="file"
  accept="image/*"
  hidden
  (change)="onAvatarSelected($event)"
/>

<ion-header>
  <ion-toolbar class="home-toolbar">
    <div class="identity-block">
      <button
        type="button"
        class="avatar-button"
        (click)="triggerAvatarPicker()"
        [disabled]="isUploadingAvatar"
      >
        <ion-avatar>
          <img
            *ngIf="clientAvatar; else defaultAvatar"
            [src]="clientAvatar"
            alt="Avatar del cliente"
            (error)="onAvatarImageError()"
          />
          <ng-template #defaultAvatar>
            <ion-icon name="person-circle-outline"></ion-icon>
          </ng-template>
        </ion-avatar>
        <ion-icon class="camera-icon" name="camera-outline"></ion-icon>
        <ion-spinner
          *ngIf="isUploadingAvatar"
          class="avatar-spinner"
          name="crescent"
        ></ion-spinner>
      </button>
      <div class="identity-info">
        <p class="client-label">Cliente</p>
        <h2>
          <button
            type="button"
            class="client-name-button"
            routerLink="/profile"
          >
            {{ clientName }}
          </button>
        </h2>
      </div>
    </div>

    <ion-buttons slot="end" class="header-actions">
      <ion-button
        class="offers-button"
        fill="outline"
        size="small"
        routerLink="/ofertas"
      >
        <ion-icon name="pricetag-outline" slot="start"></ion-icon>
        <span class="offer-text">Ofertas</span>
      </ion-button>
      <ion-button
        class="cart-button"
        routerLink="/cart"
        fill="clear"
        aria-label="Carrito"
      >
        <ion-icon class="cart-icon" name="cart-outline"></ion-icon>
        <ion-badge class="cart-badge" *ngIf="cartItemsCount > 0">
          {{ cartBadgeLabel }}
        </ion-badge>
      </ion-button>
      <ion-button routerLink="/historial" fill="clear">
        <ion-icon slot="icon-only" name="time-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="confirmLogout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <section class="filters-panel">
    <ion-searchbar
      class="name-searchbar"
      [value]="searchTerm"
      (ionInput)="onSearchInput($event)"
      placeholder="Buscar por nombre"
      showClearButton="always"
      inputmode="search"
      type="search"
    ></ion-searchbar>

    <div class="tipos-scroll" role="tablist" aria-label="Filtrar por categoría">
      <button
        type="button"
        class="tipo-chip"
        *ngFor="let tipo of tipos"
        [class.active]="selectedTipo === tipo.value"
        (click)="selectTipo(tipo.value)"
      >
        {{ tipo.label }}
      </button>
    </div>
  </section>

  <div class="product-grid">
    <app-product-card
      *ngFor="let product of products"
      [product]="product"
      [cartCount]="getProductCartCount(product)"
      (addToCart)="addToCart($event)"
      (goToDetail)="goToDetail($event)"
    ></app-product-card>
  </div>
</ion-content>
