<ion-header>
  <ion-toolbar>
    <ion-title>Editar Producto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()" color="medium">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="productForm">
    <!-- Nombre -->
    <ion-item class="ion-margin-bottom">
      <ion-label position="stacked">Nombre del Producto</ion-label>
      <ion-input
        type="text"
        formControlName="nombre"
        placeholder="Ej: Manzana Roja"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="productForm.get('nombre')?.hasError('required') && productForm.get('nombre')?.touched">
      <small>El nombre es requerido</small>
    </ion-text>

    <!-- Categoría -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label position="stacked">Categoría</ion-label>
      <ion-select formControlName="idcategoria">
        <ion-select-option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.nombre }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Precio -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label position="stacked">Precio de Venta (€)</ion-label>
      <ion-input
        type="number"
        formControlName="precio_venta"
        placeholder="0.00"
        step="0.01"
        min="0"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="productForm.get('precio_venta')?.hasError('required') && productForm.get('precio_venta')?.touched">
      <small>El precio es requerido</small>
    </ion-text>
    <ion-text color="danger" *ngIf="productForm.get('precio_venta')?.hasError('min') && productForm.get('precio_venta')?.touched">
      <small>El precio debe ser mayor a 0</small>
    </ion-text>

    <!-- Stock -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label position="stacked">Stock</ion-label>
      <ion-input
        type="number"
        formControlName="stock"
        placeholder="0"
        min="0"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="productForm.get('stock')?.hasError('required') && productForm.get('stock')?.touched">
      <small>El stock es requerido</small>
    </ion-text>

    <!-- Descripción -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label position="stacked">Descripción</ion-label>
      <ion-textarea
        formControlName="descripcion"
        placeholder="Descripción del producto (opcional)"
        rows="4"
      ></ion-textarea>
    </ion-item>

    <!-- Oferta -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label>En Oferta</ion-label>
      <ion-checkbox
        slot="start"
        formControlName="oferta"
        color="primary"
      ></ion-checkbox>
    </ion-item>

    <!-- Botones -->
    <!-- Botón Guardar -->
    <div class="button-group ion-margin-top">
      <ion-button
        expand="block"
        class="btn-save"
        (click)="save()"
        [disabled]="productForm.invalid"
      >
        <ion-icon name="checkmark" slot="start"></ion-icon>
        Guardar Cambios
      </ion-button>
    </div>
  </form>
</ion-content>
