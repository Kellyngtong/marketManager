<ion-header>
  <ion-toolbar>
    <ion-title>Admin</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <section class="admin-summary">
    <h2>Usuarios registrados</h2>
    <ion-chip color="success">
      <ion-label>{{ users.length }} usuarios</ion-label>
    </ion-chip>
  </section>

  <div *ngIf="isLoading" class="loading-placeholder">
    <ion-skeleton-text animated style="width: 100%; height: 90px"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 100%; height: 90px"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 100%; height: 90px"></ion-skeleton-text>
  </div>

  <ion-list *ngIf="!isLoading && users.length" class="users-list">
    <ion-card *ngFor="let user of users">
      <ion-card-content>
        <div class="user-head">
          <h3>{{ user.nombre }}</h3>
          <ion-chip>{{ getRoleName(user) }}</ion-chip>
        </div>

        <p class="meta">Email: {{ user.email }}</p>
        <p class="meta">ID Usuario: {{ user.idusuario }}</p>
        <p class="meta">Tenant: {{ user.id_tenant || 'N/A' }} · Store: {{ user.id_store || 'N/A' }}</p>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <div *ngIf="!isLoading && !users.length" class="empty-state">
    <p>No hay usuarios para mostrar.</p>
  </div>
</ion-content>
