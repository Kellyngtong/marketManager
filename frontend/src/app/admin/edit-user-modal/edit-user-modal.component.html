<ion-header>
  <ion-toolbar>
    <ion-title>Editar Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()" color="medium">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="userForm">
    <!-- Email -->
    <ion-item class="ion-margin-bottom">
      <ion-label position="stacked">Email</ion-label>
      <ion-input
        type="email"
        formControlName="email"
        placeholder="correo@ejemplo.com"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="userForm.get('email')?.hasError('required') && userForm.get('email')?.touched">
      <small>El email es requerido</small>
    </ion-text>
    <ion-text color="danger" *ngIf="userForm.get('email')?.hasError('email') && userForm.get('email')?.touched">
      <small>El email no es válido</small>
    </ion-text>

    <!-- Nombre -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label position="stacked">Nombre completo</ion-label>
      <ion-input
        type="text"
        formControlName="nombre"
        placeholder="Nombre completo"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="userForm.get('nombre')?.hasError('required') && userForm.get('nombre')?.touched">
      <small>El nombre es requerido</small>
    </ion-text>

    <!-- Rol -->
    <ion-item class="ion-margin-bottom ion-margin-top">
      <ion-label position="stacked">Rol</ion-label>
      <ion-select formControlName="rol">
        <ion-select-option *ngFor="let role of roles" [value]="role">
          {{ role | titlecase }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Botón Guardar -->
    <div class="button-group">
      <ion-button
        expand="block"
        class="btn-save"
        (click)="save()"
        [disabled]="userForm.invalid"
      >
        <ion-icon name="checkmark" slot="start"></ion-icon>
        Guardar Cambios
      </ion-button>
    </div>
  </form>
</ion-content>
