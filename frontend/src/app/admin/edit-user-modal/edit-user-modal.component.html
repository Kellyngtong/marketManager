<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Editar Usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="userForm">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input 
        formControlName="email"
        type="email"
        placeholder="correo@ejemplo.com"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="userForm.get('email')?.hasError('required')">
      <p class="error-message">El email es requerido</p>
    </ion-text>
    <ion-text color="danger" *ngIf="userForm.get('email')?.hasError('email')">
      <p class="error-message">El email no es válido</p>
    </ion-text>

    <ion-item>
      <ion-label position="floating">Nombre completo</ion-label>
      <ion-input 
        formControlName="nombre"
        type="text"
        placeholder="Nombre completo"
      ></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="userForm.get('nombre')?.hasError('required')">
      <p class="error-message">El nombre es requerido</p>
    </ion-text>

    <ion-item>
      <ion-label position="floating">Rol</ion-label>
      <ion-select formControlName="rol">
        <ion-select-option *ngFor="let role of roles" [value]="role">
          {{ role | titlecase }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <div class="button-group ion-margin-top">
      <ion-button fill="outline" (click)="cancel()">
        Cancelar
      </ion-button>
      <ion-button fill="solid" color="primary" (click)="save()" [disabled]="userForm.invalid">
        Guardar Cambios
      </ion-button>
    </div>
  </form>
</ion-content>
