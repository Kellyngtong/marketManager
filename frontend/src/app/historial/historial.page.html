<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Historial de Compras</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadHistorial($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-spinner name="crescent" *ngIf="isLoading" class="spinner"></ion-spinner>

  <ion-list *ngIf="historial.length; else emptyState">
    <ion-card *ngFor="let venta of historial; trackBy: trackByVenta">
      <ion-card-header>
        <div class="card-header-top">
          <div>
            <ion-card-subtitle
              >{{ venta.fecha | date:'medium' }}</ion-card-subtitle
            >
            <ion-card-title>#{{ venta.numero }}</ion-card-title>
          </div>
          <ion-badge
            [color]="venta.estado === 'Completada' ? 'success' : 'warning'"
            >{{ venta.estado }}</ion-badge
          >
        </div>
      </ion-card-header>
      <ion-card-content>
        <div class="venta-meta">
          <span class="label">Total:</span>
          <strong class="total">{{ venta.total | currency:'EUR' }}</strong>
        </div>
        <div class="venta-meta">
          <span class="label">Método:</span>
          <strong>{{ venta.metodo_pago }}</strong>
        </div>
        <div class="venta-meta">
          <span class="label">Items:</span>
          <strong>{{ venta.items?.length || 0 }} productos</strong>
        </div>
        <ion-button
          expand="block"
          (click)="verDetalle(venta)"
          class="btn-detalle"
        >
          <ion-icon name="eye" slot="start"></ion-icon>
          Ver detalle completo
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <ng-template #emptyState>
    <div class="empty-state">
      <ion-icon name="receipt"></ion-icon>
      <p>Aún no tienes compras registradas.</p>
      <ion-button [routerLink]="getShoppingRoute()" color="primary"
        >Empezar a comprar</ion-button
      >
    </div>
  </ng-template>
</ion-content>
